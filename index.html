<!doctype html>
<html class="no-js" lang="">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title></title>
		<link rel="stylesheet" href="styles/styles.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
			  rel="stylesheet">
		<link rel="stylesheet"
			  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	</head>

	<body>
		<header class="appBar">
			<section class="topAppBar container">
				<div class="leftContainer">
					<img class="leftContainer__imgLogo" src="img/logo.png" alt="">
					<h1 class="leftContainer__textLogo">oner.ru</h1>
					<div class="leftContainer__inputSearch">
						<div class="inputSearch__container">
							<input type="text"
								   placeholder="Введите номер запчасти или VIN">
						</div>

						<div class="inputSearch__imgContainer">
							<img src="img/search.svg" alt="">
						</div>

					</div>

				</div>
				<div class="rightContainer">
					<span class="rightContainer__personalInfo">
						<img src="img/location.svg" alt="">
						<a href="#">Санкт-Петербург</a>
					</span>
					<span class="rightContainer__personalInfo">
						<img src="img/phone.svg" alt="">
						<a href="tel:73472294645"><b>+7 (347) 229-46-45</b></a>
					</span>
					<span class="rightContainer__personalInfo">
						<img src="img/user.svg" alt="">
						<a href="#">Вход</a>
						<span class="spaceBetweenLinks">/</span>
						<a href="#">Регистрация</a>
					</span>
				</div>

			</section>
			<div class="line"></div>
			<section class="bottomAppBar">

			</section>

		</header>


		<script src="js/app.js"></script>

	</body>

</html>
